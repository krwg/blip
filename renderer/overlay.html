<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>BLIP Overlay</title>
  <style>
    :root {
      --bg: rgba(10, 12, 18, 0.82);
      --border: rgba(148, 163, 184, 0.32);
      --text: rgba(241, 245, 249, 0.96);
      --muted: rgba(148, 163, 184, 0.82);
      --accent: #94a3b8;
      --game: #5eead4;
      --call: #86efac;
      --warn: #fcd34d;
      --ease: cubic-bezier(0.33, 1, 0.68, 1);
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      color: var(--text);
      -webkit-user-select: none;
      user-select: none;
    }
    .panel {
      box-sizing: border-box;
      margin: 12px;
      padding: 16px 18px;
      width: calc(100% - 24px);
      min-height: calc(100% - 24px);
      border-radius: 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: 0 10px 36px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: in 200ms var(--ease) both;
    }
    @keyframes in {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: none; }
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .brand-block { min-width: 0; }
    .brand {
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .self-line {
      margin-top: 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }
    .self-id {
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
    }
    .clock {
      text-align: right;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    .clock-time {
      display: block;
      font-size: 18px;
      font-weight: 650;
      letter-spacing: 0.02em;
    }
    .clock-date {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .stat {
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.35);
      min-width: 0;
    }
    .stat-label {
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .stat-value {
      margin-top: 4px;
      font-size: 13px;
      font-weight: 650;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .body { display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; }
    .kind {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .kind--game { color: var(--game); }
    .kind--call { color: var(--call); }
    .title {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.3;
      word-break: break-word;
    }
    .sub {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .chip {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--accent);
      background: rgba(15, 23, 42, 0.4);
    }
    .chip--warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
    .chip--ok { color: var(--call); border-color: color-mix(in srgb, var(--call) 40%, transparent); }
    .chip.hidden { display: none; }
    .call-box {
      padding: 12px 12px 14px;
      border-radius: 12px;
      border: 1px solid color-mix(in srgb, var(--call) 40%, transparent);
      background: color-mix(in srgb, var(--call) 12%, transparent);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .call-box.hidden { display: none; }
    .call-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 2px;
    }
    .transfer-box {
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.4);
      font-size: 12px;
      color: var(--muted);
    }
    .transfer-box.hidden { display: none; }
    .transfer-box strong { color: var(--text); font-weight: 650; }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--muted);
      padding-top: 2px;
      border-top: 1px solid rgba(148, 163, 184, 0.16);
    }
    .badge {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--accent);
    }
    .badge.hidden { display: none; }
    .idle .title { color: var(--muted); font-weight: 550; }
  </style>
</head>
<body>
  <div class="panel idle" id="panel">
    <div class="top">
      <div class="brand-block">
        <div class="brand">BLIP</div>
        <div class="self-line" id="selfLine">—</div>
      </div>
      <div class="clock">
        <span class="clock-time" id="clockTime">--:--</span>
        <span class="clock-date" id="clockDate"></span>
      </div>
    </div>

    <div class="stats" id="stats">
      <div class="stat">
        <div class="stat-label">Status</div>
        <div class="stat-value" id="statPresence">Online</div>
      </div>
      <div class="stat">
        <div class="stat-label">Mesh</div>
        <div class="stat-value" id="statPeers">0 online</div>
      </div>
      <div class="stat">
        <div class="stat-label">Unread</div>
        <div class="stat-value" id="statUnread">0</div>
      </div>
    </div>

    <div class="body">
      <div class="kind" id="kind"></div>
      <div class="title" id="title">—</div>
      <div class="sub" id="sub"></div>
      <div class="chips" id="activityChips"></div>

      <div class="call-box hidden" id="callBox">
        <div class="kind kind--call">In call</div>
        <div class="title" id="callPeer" style="font-size:15px"></div>
        <div class="sub" id="callElapsed"></div>
        <div class="call-meta" id="callMeta"></div>
      </div>

      <div class="transfer-box hidden" id="transferBox">
        <strong id="transferLabel">Transfer</strong>
        <span id="transferPct"></span>
      </div>
    </div>

    <div class="footer">
      <span id="meta"></span>
      <span class="badge hidden" id="unread"></span>
    </div>
  </div>
  <script type="module" src="./overlay.js"></script>
</body>
</html>
