<!DOCTYPE html>
<html lang="en" data-ui-skin="pixel" data-theme="dark" data-accent="mint">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>BLIP Overlay</title>
  <style>
    :root {
      --bg: rgba(12, 14, 20, 0.88);
      --border: rgba(148, 163, 184, 0.28);
      --text: rgba(241, 245, 249, 0.96);
      --muted: rgba(148, 163, 184, 0.78);
      --accent: #94a3b8;
      --call: #86efac;
      --danger: #f87171;
      --warn: #fcd34d;
      --radius: 0px;
      --ease: cubic-bezier(0.33, 1, 0.68, 1);
      --font: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    }
    html[data-ui-skin='pixel'] {
      --radius: 0px;
      --pill-radius: 0px;
      --font: ui-monospace, "Cascadia Mono", Consolas, monospace;
    }
    html[data-ui-skin='nest'] {
      --radius: 18px;
      --pill-radius: 999px;
      --bg: rgba(28, 28, 30, 0.72);
      --border: rgba(255, 255, 255, 0.1);
      --text: rgba(245, 245, 247, 0.96);
      --muted: rgba(152, 152, 157, 0.95);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
      --nest-fill: rgba(44, 44, 46, 0.55);
      --nest-hairline: rgba(255, 255, 255, 0.08);
    }
    html[data-ui-skin='nest'][data-theme='light'] {
      --bg: rgba(245, 245, 247, 0.78);
      --border: rgba(0, 0, 0, 0.08);
      --text: rgba(29, 29, 31, 0.96);
      --muted: rgba(110, 110, 115, 0.95);
      --nest-fill: rgba(255, 255, 255, 0.55);
      --nest-hairline: rgba(0, 0, 0, 0.08);
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: var(--font);
      color: var(--text);
      -webkit-user-select: none;
      user-select: none;
    }
    .panel {
      box-sizing: border-box;
      margin: 10px;
      padding: 14px 14px 12px;
      width: calc(100% - 20px);
      min-height: calc(100% - 20px);
      border-radius: var(--radius);
      background: var(--bg);
      border: 1px solid var(--border);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: 0 10px 36px rgba(0, 0, 0, 0.42);
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: in 200ms var(--ease) both;
    }
    html[data-ui-skin='nest'] .panel {
      border-radius: 22px;
      padding: 16px 16px 14px;
      margin: 8px;
      width: calc(100% - 16px);
      min-height: calc(100% - 16px);
      gap: 14px;
      border: 0.5px solid var(--nest-hairline);
      background: var(--bg);
      backdrop-filter: saturate(1.45) blur(36px);
      -webkit-backdrop-filter: saturate(1.45) blur(36px);
      box-shadow:
        0 18px 48px rgba(0, 0, 0, 0.45),
        0 1px 0 rgba(255, 255, 255, 0.06) inset;
      letter-spacing: -0.011em;
      -webkit-font-smoothing: antialiased;
    }
    html[data-ui-skin='nest'] .brand {
      font-size: 11px;
      letter-spacing: 0.06em;
      font-weight: 600;
      opacity: 0.72;
    }
    html[data-ui-skin='nest'] .self-line {
      margin-top: 4px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
      max-width: 200px;
    }
    html[data-ui-skin='nest'] .self-id {
      font-weight: 500;
      opacity: 0.72;
    }
    html[data-ui-skin='nest'] .clock-time {
      font-size: 18px;
      font-weight: 650;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }
    html[data-ui-skin='nest'] .clock-date {
      font-size: 11px;
      margin-top: 3px;
      letter-spacing: -0.01em;
    }
    html[data-ui-skin='nest'] .stats {
      gap: 8px;
    }
    html[data-ui-skin='nest'] .stat {
      border: none;
      border-radius: 14px;
      background: var(--nest-fill);
      box-shadow: inset 0 0 0 0.5px var(--nest-hairline);
      padding: 10px 12px;
    }
    html[data-ui-skin='nest'] .stat-label {
      font-size: 10px;
      letter-spacing: 0.04em;
      font-weight: 510;
      opacity: 0.8;
    }
    html[data-ui-skin='nest'] .stat-value {
      margin-top: 5px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    html[data-ui-skin='nest'] .kind {
      font-size: 11px;
      letter-spacing: 0.04em;
      font-weight: 510;
    }
    html[data-ui-skin='nest'] .title {
      font-size: 16px;
      font-weight: 650;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }
    html[data-ui-skin='nest'] .sub {
      font-size: 12px;
      letter-spacing: -0.01em;
      line-height: 1.45;
    }
    html[data-ui-skin='nest'] .chip {
      border: none;
      border-radius: 999px;
      background: var(--nest-fill);
      box-shadow: inset 0 0 0 0.5px var(--nest-hairline);
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 510;
    }
    html[data-ui-skin='nest'] .call-box {
      border-radius: 18px;
      border: none;
      box-shadow: inset 0 0 0 0.5px color-mix(in srgb, var(--call) 35%, transparent);
      background: color-mix(in srgb, var(--call) 12%, var(--nest-fill));
      padding: 14px;
      gap: 12px;
    }
    html[data-ui-skin='nest'] .call-btn {
      border: none;
      border-radius: 12px;
      background: var(--nest-fill);
      box-shadow: inset 0 0 0 0.5px var(--nest-hairline);
      padding: 11px 12px;
      font-weight: 590;
      letter-spacing: -0.01em;
    }
    html[data-ui-skin='nest'] .call-btn:hover {
      background: color-mix(in srgb, var(--text) 10%, var(--nest-fill));
    }
    html[data-ui-skin='nest'] .call-btn--end {
      background: color-mix(in srgb, var(--danger) 18%, transparent);
      box-shadow: inset 0 0 0 0.5px color-mix(in srgb, var(--danger) 40%, transparent);
    }
    html[data-ui-skin='nest'] .call-foot,
    html[data-ui-skin='nest'] .footer {
      border-top: 0.5px solid var(--nest-hairline);
      padding-top: 8px;
    }
    html[data-ui-skin='nest'] .badge,
    html[data-ui-skin='nest'] .ptt-pill,
    html[data-ui-skin='nest'] .legacy-pill,
    html[data-ui-skin='nest'] .call-badge {
      border: none;
      border-radius: 999px;
      background: var(--nest-fill);
      box-shadow: inset 0 0 0 0.5px var(--nest-hairline);
      font-weight: 510;
      letter-spacing: 0.02em;
    }
    html[data-ui-skin='nest'] .transfer-box {
      border: none;
      border-radius: 14px;
      background: var(--nest-fill);
      box-shadow: inset 0 0 0 0.5px var(--nest-hairline);
      padding: 10px 12px;
    }
    @keyframes in {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: none; }
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .brand-block { min-width: 0; }
    .brand {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .self-line {
      margin-top: 3px;
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 190px;
    }
    .self-id { color: var(--muted); font-weight: 500; }
    .clock { text-align: right; font-variant-numeric: tabular-nums; flex-shrink: 0; }
    .clock-time { display: block; font-size: 17px; font-weight: 650; }
    .clock-date { display: block; font-size: 10px; color: var(--muted); margin-top: 2px; }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .stats.has-unread { grid-template-columns: 1fr 1fr 1fr; }
    .stat {
      padding: 8px 10px;
      border-radius: calc(var(--radius) + 2px);
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.35);
      min-width: 0;
    }
    .stat.hidden { display: none; }
    .stat-label {
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .stat-value {
      margin-top: 4px;
      font-size: 13px;
      font-weight: 650;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .body { display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; }
    .kind {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .kind--game { color: #5eead4; }
    .title {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.3;
      word-break: break-word;
    }
    .sub { font-size: 12px; color: var(--muted); line-height: 1.4; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: var(--pill-radius, 0px);
      border: 1px solid var(--border);
      color: var(--accent);
      background: rgba(15, 23, 42, 0.4);
    }
    .chip--warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
    .chip--ok { color: var(--call); border-color: color-mix(in srgb, var(--call) 40%, transparent); }
    .idle .activity-block .title { color: var(--muted); font-weight: 550; }
    .activity-block.hidden { display: none; }

    .call-box {
      padding: 12px;
      border-radius: calc(var(--radius) + 4px);
      border: 1px solid color-mix(in srgb, var(--call) 38%, transparent);
      background: color-mix(in srgb, var(--call) 10%, transparent);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .call-box.hidden { display: none; }
    .call-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .call-peer-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .call-avatar {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border-radius: calc(var(--radius) + 2px);
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--call) 35%, transparent);
      background: #0b3d32;
      display: grid;
      place-items: center;
      transition: box-shadow 160ms var(--ease), border-color 160ms var(--ease);
    }
    .call-avatar--speaking {
      border-color: color-mix(in srgb, var(--call) 85%, #fff);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--call) 55%, transparent),
        0 0 14px color-mix(in srgb, var(--call) 35%, transparent);
    }
    html[data-ui-skin='nest'] .call-avatar {
      border-radius: 999px;
      border: none;
      box-shadow: inset 0 0 0 0.5px color-mix(in srgb, var(--call) 40%, transparent);
      background: color-mix(in srgb, var(--call) 18%, #1c1c1e);
    }
    .call-avatar canvas,
    .call-avatar img {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }
    .call-avatar-initials {
      font-size: 13px;
      font-weight: 700;
      color: var(--call);
      letter-spacing: 0.02em;
    }
    .call-peer-meta { min-width: 0; }
    .call-peer-name {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .call-peer-sub {
      margin-top: 2px;
      font-size: 12px;
      color: var(--call);
      font-variant-numeric: tabular-nums;
    }
    .call-badge {
      flex-shrink: 0;
      font-size: 10px;
      padding: 3px 8px;
      border-radius: var(--pill-radius, 0px);
      border: 1px solid color-mix(in srgb, var(--call) 45%, transparent);
      color: var(--call);
      text-transform: lowercase;
      letter-spacing: 0.02em;
    }
    .call-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .call-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: rgba(30, 34, 48, 0.85);
      color: rgba(226, 232, 240, 0.88);
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 12px;
      border-radius: calc(var(--radius) + 2px);
      cursor: pointer;
      transition: background 140ms var(--ease), border-color 140ms var(--ease), color 140ms var(--ease);
    }
    .call-btn:hover { background: rgba(45, 50, 68, 0.95); }
    .call-btn:active { transform: scale(0.98); }
    .call-btn--mute.is-muted {
      color: var(--warn);
      border-color: color-mix(in srgb, var(--warn) 40%, transparent);
      background: color-mix(in srgb, var(--warn) 12%, transparent);
    }
    .call-btn--end {
      color: var(--danger);
      border-color: color-mix(in srgb, var(--danger) 40%, transparent);
      background: color-mix(in srgb, var(--danger) 12%, transparent);
    }
    .call-btn--end:hover {
      background: color-mix(in srgb, var(--danger) 20%, transparent);
    }
    .call-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 2px;
      border-top: 1px solid rgba(148, 163, 184, 0.16);
    }
    .call-metrics {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }
    .metric-label {
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .metric-value {
      margin-top: 2px;
      font-size: 12px;
      font-weight: 650;
    }
    .metric-value--ok { color: var(--call); }
    .metric-value--bad { color: var(--danger); }
    .mic-meter {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 14px;
      margin-left: 4px;
    }
    .mic-meter span {
      width: 3px;
      border-radius: 1px;
      background: color-mix(in srgb, var(--call) 70%, transparent);
      animation: micPulse 900ms ease-in-out infinite;
    }
    .mic-meter span:nth-child(1) { height: 40%; animation-delay: 0ms; }
    .mic-meter span:nth-child(2) { height: 75%; animation-delay: 120ms; }
    .mic-meter span:nth-child(3) { height: 55%; animation-delay: 240ms; }
    .mic-meter span:nth-child(4) { height: 90%; animation-delay: 80ms; }
    .mic-meter.is-live span {
      animation: none;
      background: color-mix(in srgb, var(--call) 85%, transparent);
    }
    .mic-meter.is-muted span {
      animation: none;
      height: 22% !important;
      background: color-mix(in srgb, var(--muted) 70%, transparent);
    }
    .ptt-pill {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: var(--pill-radius, 0px);
      border: 1px solid var(--border);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .ptt-pill.is-hot {
      color: var(--call);
      border-color: color-mix(in srgb, var(--call) 45%, transparent);
      background: color-mix(in srgb, var(--call) 12%, transparent);
    }
    .ptt-pill.hidden { display: none; }
    @keyframes micPulse {
      0%, 100% { transform: scaleY(0.55); }
      50% { transform: scaleY(1); }
    }
    .legacy-pill {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: var(--pill-radius, 0px);
      border: 1px solid color-mix(in srgb, #60a5fa 45%, transparent);
      color: #93c5fd;
      background: color-mix(in srgb, #3b82f6 14%, transparent);
    }
    .legacy-pill.hidden { display: none; }

    .transfer-box {
      padding: 8px 10px;
      border-radius: calc(var(--radius) + 2px);
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.4);
      font-size: 12px;
      color: var(--muted);
    }
    .transfer-box.hidden { display: none; }
    .transfer-box strong { color: var(--text); font-weight: 650; }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--muted);
      padding-top: 2px;
      border-top: 1px solid rgba(148, 163, 184, 0.16);
    }
    .footer-app {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .footer-app.hidden { visibility: hidden; }
    .badge {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: var(--pill-radius, 0px);
      border: 1px solid var(--border);
      color: var(--accent);
    }
    .badge.hidden { display: none; }
  </style>
</head>
<body>
  <div class="panel idle" id="panel">
    <div class="top">
      <div class="brand-block">
        <div class="brand">BLIP</div>
        <div class="self-line" id="selfLine">—</div>
      </div>
      <div class="clock">
        <span class="clock-time" id="clockTime">--:--</span>
        <span class="clock-date" id="clockDate"></span>
      </div>
    </div>

    <div class="stats" id="stats">
      <div class="stat">
        <div class="stat-label" id="labelStatus">Status</div>
        <div class="stat-value" id="statPresence">Online</div>
      </div>
      <div class="stat">
        <div class="stat-label" id="labelMesh">Mesh</div>
        <div class="stat-value" id="statPeers">0 online</div>
      </div>
      <div class="stat hidden" id="statUnreadWrap">
        <div class="stat-label" id="labelUnread">Unread</div>
        <div class="stat-value" id="statUnread">0</div>
      </div>
    </div>

    <div class="body">
      <div class="activity-block" id="activityBlock">
        <div class="kind" id="kind"></div>
        <div class="title" id="title">—</div>
        <div class="sub" id="sub"></div>
        <div class="chips" id="activityChips"></div>
      </div>

      <div class="call-box hidden" id="callBox" data-overlay-interactive>
        <div class="call-head">
          <div class="call-peer-row">
            <div class="call-avatar" id="callAvatar"></div>
            <div class="call-peer-meta">
              <div class="call-peer-name" id="callPeer"></div>
              <div class="call-peer-sub" id="callElapsed"></div>
            </div>
          </div>
          <div class="call-badge" id="callBadge">in call</div>
        </div>
        <div class="call-actions">
          <button type="button" class="call-btn call-btn--mute" id="muteBtn" data-overlay-interactive>mute</button>
          <button type="button" class="call-btn call-btn--end" id="endBtn" data-overlay-interactive>end</button>
        </div>
        <div class="call-foot">
          <div class="call-metrics">
            <div>
              <div class="metric-label" id="labelCallMesh">Mesh</div>
              <div class="metric-value" id="callMesh">—</div>
            </div>
            <div>
              <div class="metric-label" id="labelCallPing">Ping</div>
              <div class="metric-value metric-value--ok" id="callPing">—</div>
            </div>
            <div class="mic-meter" id="micMeter" data-overlay-interactive title="Microphone">
              <span></span><span></span><span></span><span></span>
            </div>
            <span class="ptt-pill hidden" id="pttPill">PTT</span>
          </div>
          <span class="legacy-pill hidden" id="legacyPill">Legacy</span>
        </div>
      </div>

      <div class="transfer-box hidden" id="transferBox">
        <strong id="transferLabel">Transfer</strong>
        <span id="transferPct"></span>
      </div>
    </div>

    <div class="footer">
      <span class="footer-app" id="footerApp"></span>
      <span class="badge hidden" id="unread"></span>
    </div>
  </div>
  <script type="module" src="./overlay.js"></script>
</body>
</html>
